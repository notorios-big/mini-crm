version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      - FRONTEND_URL=http://localhost:3010
    volumes:
      - ./backend/database.sqlite:/app/database.sqlite
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3010:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  database:
  uploads:
